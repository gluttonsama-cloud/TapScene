name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: ci/gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose checks from changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          # Include both paths of a rename, so moving source into docs cannot skip checks.
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z", os.environ["BASE_SHA"], "HEAD",
          ]).decode("utf-8").split("\0")
          def needs_android(path):
              if path.startswith(("android/", "tools/media-checks/", "tools/project-checks/", ".github/workflows/")):
                  return True
              return not (path.startswith(("docs/", "tools/signing/")) or path.endswith(".md"))
          android = any(needs_android(path) for path in changed if path)
          ai = any(path.startswith(("remotion-adapter/", "tools/package-checks/", "android/app/src/main/java/com/tapscene/packageformat/", ".github/workflows/")) for path in changed if path)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"android={str(android).lower()}\n")
              output.write(f"ai={str(ai).lower()}\n")
          print("Android/media checks required." if android else
                "Android/media checks skipped: only documentation or signing tooling changed.")
          PY
      - name: Check document encoding and changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z", "--", "*.md"])
          for path in paths.decode("utf-8").split("\0"):
              if path:
                  Path(path).read_bytes().decode("utf-8")
          PY
          git diff --check "$BASE_SHA" HEAD
      - name: Check signing tool syntax without executing it
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in sorted(Path("tools/signing").glob("*.py")):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax checked: {path}")
          PY
      - name: Use the runner's JDK 17
        if: steps.scope.outputs.android == 'true'
        run: |
          test -x "$JAVA_HOME_17_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Gradle
        if: steps.scope.outputs.android == 'true'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install media inspection tools from Ubuntu
        if: steps.scope.outputs.android == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Check and materialize real phone-media fixtures
        if: steps.scope.outputs.android == 'true'
        run: |
          python3 tools/media-checks/materialize-fixtures.py "$RUNNER_TEMP/media-fixtures" --verify-media 2>&1 | tee "$RUNNER_TEMP/fixture-checks.txt"
          grep -qx TAPSCENE_FIXTURE_CHECKS_OK "$RUNNER_TEMP/fixture-checks.txt"
      - name: Check project graph schema invariants
        if: steps.scope.outputs.android == 'true'
        run: |
          python3 tools/project-checks/check-schema.py
          python3 tools/project-checks/check-origin-migration.py
      - name: Check bounded screenshot input parser with synthetic images
        if: steps.scope.outputs.android == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/image-check-env"
          "$RUNNER_TEMP/image-check-env/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/image-check-env/bin/python" tools/image-checks/check-images.py | tee "$RUNNER_TEMP/image-checks.txt"
      - name: Prepare the pinned offline OCR sources and models
        if: steps.scope.outputs.android == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1"
          python3 tools/ocr-native/prepare.py --host
      - name: Build and exercise the same raw-pixel OCR core on synthetic UI images
        if: steps.scope.outputs.android == 'true'
        run: |
          cmake -S android/app/src/main/cpp -B "$RUNNER_TEMP/ocr-host" \
            -DCMAKE_BUILD_TYPE=Release -DTAPSCENE_HOST_TEST=ON
          cmake --build "$RUNNER_TEMP/ocr-host" --target tapscene_ocr_fixture tapscene_ocr_core_tests -j2
          "$RUNNER_TEMP/ocr-host/tapscene_ocr_core_tests" android/app/build/ocr/assets/ocr
          python3 tools/ocr-checks/check-store.py
          python3 tools/ocr-checks/check-metrics.py
          python3 tools/ocr-checks/check-ocr.py \
            --native-runner "$RUNNER_TEMP/ocr-host/tapscene_ocr_fixture" \
            --model-dir android/app/build/ocr/assets/ocr \
            --output "$RUNNER_TEMP/ocr-results" --repeat 2
          python3 tools/ocr-native/check-resources.py \
            --native-runner "$RUNNER_TEMP/ocr-host/tapscene_ocr_fixture" \
            --model-dir android/app/build/ocr/assets/ocr --output "$RUNNER_TEMP/ocr-results/resources"
      - name: Keep the synthetic OCR results
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapscene-ocr-checks
          path: |
            ${{ runner.temp }}/ocr-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check the real offline package codec and player reducer
        if: steps.scope.outputs.android == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/package-check-classes"
          javac --release 17 -d "$RUNNER_TEMP/package-check-classes" \
            android/app/src/main/java/com/tapscene/packageformat/*.java \
            tools/package-checks/*.java
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/package-check-classes" PackageSecurityChecks \
            "$RUNNER_TEMP/package-fixtures" 2>&1 | tee "$RUNNER_TEMP/package-checks.txt"
          grep -Ex 'TAPSCENE_PACKAGE_CHECKS_OK: passed=[1-9][0-9]* failed=0' "$RUNNER_TEMP/package-checks.txt"
      - name: Keep synthetic offline packages and codec evidence
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapscene-offline-package-checks
          path: |
            ${{ runner.temp }}/package-checks.txt
            ${{ runner.temp }}/image-checks.txt
            ${{ runner.temp }}/package-fixtures/smallest-viewer.tapscene
            ${{ runner.temp }}/package-fixtures/branch-viewer.tapscene
            ${{ runner.temp }}/package-fixtures/synthetic.tapscene
            ${{ runner.temp }}/package-fixtures/video/video-viewer.tapscene
            ${{ runner.temp }}/package-fixtures/video/results.txt
          retention-days: 7
          if-no-files-found: error
      - name: Set up Node for the independent trusted adapter
        if: steps.scope.outputs.ai == 'true' || steps.scope.outputs.android == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Prepare the independent trusted adapter
        if: steps.scope.outputs.ai == 'true' || steps.scope.outputs.android == 'true'
        working-directory: remotion-adapter
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Check AI data contracts and render actual synthetic videos
        if: steps.scope.outputs.ai == 'true'
        timeout-minutes: 15
        run: |
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/package-check-classes" AiPackageChecks \
            "$RUNNER_TEMP/ai-fixtures" 2>&1 | tee "$RUNNER_TEMP/ai-package-checks.txt"
          grep -E '^TAPSCENE_AI_PACKAGE_CHECKS_PASSED: [1-9][0-9]* assertions/rejections;' "$RUNNER_TEMP/ai-package-checks.txt"
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
          cd remotion-adapter
          npm run check
          mkdir -p "$RUNNER_TEMP/ai-render"
          npm run render -- "$RUNNER_TEMP/ai-fixtures/synthetic-portrait.tapscene-ai" "$RUNNER_TEMP/ai-render/synthetic-portrait.mp4"
          npm run render -- "$RUNNER_TEMP/ai-fixtures/synthetic-landscape.tapscene-ai" "$RUNNER_TEMP/ai-render/synthetic-landscape.mp4"
          npm run render -- "$RUNNER_TEMP/ai-fixtures/synthetic-video.tapscene-ai" "$RUNNER_TEMP/ai-render/synthetic-video.mp4"
          # Sample the same authored image-background patch before, at the
          # middle of, and after the dissolve in the actual encoded videos.
          python3 - <<'PY_CHECK'
          import os
          import subprocess
          from pathlib import Path
          for shape, x, y in [("portrait", 225, 1375), ("landscape", 359, 820)]:
              video = Path(os.environ["RUNNER_TEMP"]) / "ai-render" / f"synthetic-{shape}.mp4"
              pixels = subprocess.check_output(["ffmpeg", "-v", "error", "-i", str(video),
                  "-vf", f"select='eq(n,60)+eq(n,71)+eq(n,85)',crop=8:8:{x}:{y}",
                  "-vsync", "0", "-f", "rawvideo", "-pix_fmt", "rgb24", "-"])
              size = 8 * 8 * 3
              assert len(pixels) == size * 3, "Missing dissolve verification frames"
              means = [sum(pixels[i:i+size]) / size for i in range(0, len(pixels), size)]
              assert min(means) > 230 and max(means) - min(means) <= 3, (shape, means)
              print(f"DISSOLVE_PIXELS_OK {shape}: before/mid/after={means}")
          PY_CHECK
          ffmpeg -v error -i "$RUNNER_TEMP/ai-render/synthetic-video.mp4" -ss 4.5 -frames:v 1 "$RUNNER_TEMP/ai-render/video-4.5.png"
          for shape in portrait landscape; do
            for position in 0.5 2.5 5.5 8; do
              ffmpeg -v error -i "$RUNNER_TEMP/ai-render/synthetic-$shape.mp4" -ss "$position" -frames:v 1 "$RUNNER_TEMP/ai-render/$shape-$position.png"
            done
          done
          cp "$RUNNER_TEMP/ai-fixtures/fixture-note.txt" "$RUNNER_TEMP/ai-render/"
      - name: Keep actual AI renders and package evidence
        if: always() && steps.scope.outputs.ai == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tapscene-ai-render-checks
          path: |
            ${{ runner.temp }}/ai-render/
            ${{ runner.temp }}/ai-package-checks.txt
            ${{ runner.temp }}/ai-fixtures/synthetic-portrait.tapscene-ai
            ${{ runner.temp }}/ai-fixtures/synthetic-landscape.tapscene-ai
            ${{ runner.temp }}/ai-fixtures/synthetic-video.tapscene-ai
          retention-days: 7
          if-no-files-found: error
      - name: Build the arm64 phone preview and run lint
        if: steps.scope.outputs.android == 'true'
        run: gradle -p android --no-daemon --max-workers=2 -PcompatibilityPreview=true -PtapsceneAbi=arm64-v8a :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Build the unsigned local-hosting development variant and inspect isolation
        if: steps.scope.outputs.android == 'true'
        run: |
          gradle -p android --no-daemon --max-workers=2 -PcompatibilityPreview=true -PtapsceneAbi=arm64-v8a :app:assembleHostedDebug :app:lintHostedDebug
          python3 tools/hosting-checks/check-manifests.py
      - name: Execute production Android data and static AI round-trip checks
        id: host_data
        if: steps.scope.outputs.android == 'true'
        timeout-minutes: 10
        env:
          TAPSCENE_AI_ROUNDTRIP_OUTPUT: ${{ runner.temp }}/ai-round-trip
        run: |
          set -o pipefail
          gradle -p android --no-daemon --max-workers=2 -PcompatibilityPreview=true -PtapsceneAbi=arm64-v8a \
            :app:testDebugUnitTest \
            --tests com.tapscene.data.ProjectStoreHostTest \
            --tests com.tapscene.ui.ProjectWorkspaceHostTest \
            --tests com.tapscene.data.AiRoundTripHostTest \
            --tests com.tapscene.data.SavedStepCopyHostTest \
            --tests com.tapscene.data.SavedProjectCopyHostTest \
            --tests com.tapscene.data.HostedReleaseHostTest \
            --tests com.tapscene.ui.CopyWorkspaceHostTest \
            --tests com.tapscene.sharing.OfflineShareHostTest \
            --tests com.tapscene.ui.OfflineShareWorkspaceHostTest \
            --tests com.tapscene.ui.HostingWorkspaceHostTest \
            --tests com.tapscene.ocr.TextRegionPolicyTest \
            --tests com.tapscene.data.TextRegionDraftHostTest \
            --tests com.tapscene.ui.TextRegionWorkspaceHostTest \
            2>&1 | tee "$RUNNER_TEMP/host-data-checks.txt"
      - name: Verify the exact host checks executed without failures or skips
        if: always() && steps.host_data.outcome != 'skipped' && steps.scope.outputs.android == 'true'
        run: |
          python3 - <<'PY_HOST'
          from collections import Counter
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          root = Path("android/app/build/test-results/testDebugUnitTest")
          files = sorted(root.glob("TEST-*.xml"))
          expected = {
              ("com.tapscene.ocr.TextRegionPolicyTest", "emptyInvalidAndOversizedInputsReturnNoSuggestions"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "twoCharacterLabelsKeepExactSourceBoundsWithoutPadding"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "recognitionThresholdDoesNotBecomeClickProbability"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "blankSymbolsControlsAndOneCharacterNoiseAreRejected"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "invalidBoxesSmallFragmentsAndPageSizedRegionsAreRejected"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "onlyCloseAlignedWordsInTheSameReportedLineAreJoined"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "longParagraphAndShortDenseRowsAreNotOffered"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "shortTailOfLongParagraphIsRejectedButSparseLabelsRemain"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "overlappingDetectionsKeepBestReadingButDistinctRepeatedLabelsRemain"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "existingHotspotsSuppressContainmentAndHighOverlapOnly"): 1,
              ("com.tapscene.ocr.TextRegionPolicyTest", "resultsAreBoundedAndStableInReadingOrderWithoutChangingInput"): 1,
              ("com.tapscene.data.TextRegionDraftHostTest", "codecV1CompatibilityAndStrictBoundFormRoundTrip"): 1,
              ("com.tapscene.data.TextRegionDraftHostTest", "rejectsMalformedOrMisownedSuggestionWithoutReplacingDraft"): 1,
              ("com.tapscene.data.TextRegionDraftHostTest", "sourceMismatchAndMissingBytesPreserveFormalAndRecoveryState"): 1,
              ("com.tapscene.data.TextRegionDraftHostTest", "finalSaveCannotBypassPersistedSourceAndAllowsExplicitCancellation"): 1,
              ("com.tapscene.data.TextRegionDraftHostTest", "textRevisionKeepsSourceValidAndSuccessClearsOnlyThisDraft"): 1,
              ("com.tapscene.ui.TextRegionWorkspaceHostTest", "exactPixelsLateResultsAndRecoveredFormsKeepTheirSourceAndAuthorIntent"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "cancellingAfterInstallCannotReopenAccountWhenRetirementIsOffline"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "repeatedConfirmPreparesOnceAndBusyObservationCanCancel"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "confirmedCancelIntentSurvivesImmediateLeave"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "cancelledLoginDrainsAndRevokesLateSessionWithoutResurrectingRoute"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "unauthorizedManagementAllowsNewLoginWithoutLogout"): 1,
              ("com.tapscene.ui.HostingWorkspaceHostTest", "malformedSuccessfulLoginResponseIsUnknownNotAReusableChallenge"): 1,
              ("com.tapscene.data.HostedReleaseHostTest", "sealedProvenanceAndExactSnapshotSurviveSourceDeletion"): 1,
              ("com.tapscene.data.ProjectStoreHostTest", "historicalMigrationsAndRollback"): 2,
              ("com.tapscene.data.ProjectStoreHostTest", "rejectsInvalidLegacySchemasAndRelations"): 1,
              ("com.tapscene.data.ProjectStoreHostTest", "rawPendingFormReopensAndStaleSessionIsRejected"): 1,
              ("com.tapscene.data.ProjectStoreHostTest", "saveIsAtomicAndPreservesTheOtherStep"): 1,
              ("com.tapscene.data.ProjectStoreHostTest", "temporaryStoreClosesOnlyItsOwnConnection"): 1,
              ("com.tapscene.ui.ProjectWorkspaceHostTest", "cancellationAndDiscardDoNotReviveCommittedForms"): 1,
              ("com.tapscene.ui.ProjectWorkspaceHostTest", "singleEditorUndoCoalescesAndHonorsSaveNavigationAndRevisionBoundaries"): 1,
              ("com.tapscene.data.AiRoundTripHostTest", "completeStaticPackageReturnsAsReviewedRelease"): 1,
              ("com.tapscene.data.SavedStepCopyHostTest", "savedGraphCopiesIndependentlyWithoutRetargetingOrInheritingReview"): 1,
              ("com.tapscene.data.SavedStepCopyHostTest", "originsRemainLocalAndMissingRawSourcesAreNeverRequired"): 1,
              ("com.tapscene.data.SavedStepCopyHostTest", "rejectsUnsafePixelsAndFailuresLeaveNoPartialCopy"): 1,
              ("com.tapscene.data.SavedStepCopyHostTest", "retriesRacesAndCancellationResolveFromDurableState"): 1,
              ("com.tapscene.data.SavedStepCopyHostTest", "allGraphLimitsAreCheckedBeforeAddingTheCompleteCopy"): 1,
              ("com.tapscene.ui.CopyWorkspaceHostTest", "copyHandlesSourceInputCancellationAndOtherStepRecovery"): 1,
              ("com.tapscene.ui.CopyWorkspaceHostTest", "projectCopyBlocksAllDraftsAndReconcilesDurableResult"): 1,
              ("com.tapscene.data.SavedProjectCopyHostTest", "completeSavedGraphMediaAndAiRemainIndependent"): 1,
              ("com.tapscene.data.SavedProjectCopyHostTest", "failuresRetriesAndUncertainDeliveryDoNotDuplicateOrLoseFiles"): 1,
              ("com.tapscene.data.SavedProjectCopyHostTest", "frozenVersionEightMigratesWithoutChangingExistingData"): 1,
              ("com.tapscene.sharing.OfflineShareHostTest", "exactReadOnlyUrisRejectTraversalTamperingAndExpiry"): 2,
              ("com.tapscene.sharing.OfflineShareHostTest", "cacheLimitsAndCancelledPreparationPreserveExistingSnapshots"): 2,
              ("com.tapscene.ui.OfflineShareWorkspaceHostTest", "chooserRequestIsConsumedOnceAndNeverRestoredAfterExit"): 1,
          }
          actual = Counter()
          failures = errors = skipped = 0
          seconds = 0.0
          output = []
          for file in files:
              suite = ET.parse(file).getroot()
              for case in suite.iter("testcase"):
                  actual[(case.get("classname"), case.get("name", "").split("[")[0])] += 1
                  failures += len(case.findall("failure"))
                  errors += len(case.findall("error"))
                  skipped += len(case.findall("skipped"))
                  seconds += float(case.get("time", "0"))
              output.extend(node.text or "" for node in suite.iter("system-out"))
              if suite.get("name") in ("com.tapscene.data.AiRoundTripHostTest", "com.tapscene.data.SavedStepCopyHostTest", "com.tapscene.data.SavedProjectCopyHostTest", "com.tapscene.ui.CopyWorkspaceHostTest"):
                  stderr = "\n".join(node.text or "" for node in suite.iter("system-err"))
                  assert "Explicit termination method 'close' not called" not in stderr, "Native PNG host check leaked a CloseGuard resource"
          summary = (f"HOST_DATA_EXECUTION tests={sum(actual.values())} failures={failures} errors={errors} "
                     f"skipped={skipped} test_seconds={seconds:.3f}; expected_entry_points={len(expected)}")
          print(summary)
          (Path(os.environ["RUNNER_TEMP"]) / "host-data-execution.txt").write_text(summary + "\n", encoding="utf-8")
          assert actual == Counter(expected), f"Missing/unexpected executed tests: {actual}"
          assert failures == errors == skipped == 0, summary
          evidence = "\n".join(output)
          for api in (26, 35):
              assert f"HOST_SQLITE api={api} " in evidence, f"Missing API {api} native SQLite evidence"
          assert "mode=NATIVE journal=truncate sync=2" in evidence
          for boundary in ("save-before-commit", "save-after-commit", "discard-before/after-commit", "owner/store recreation"):
              assert f"HOST_CANCEL {boundary}" in evidence, f"Missing cancellation boundary: {boundary}"
          assert "HOST_AI_ROUNDTRIP api=35 graphics=NATIVE sqlite=NATIVE" in evidence
          assert "HOST_FILE_SYNC backend=Linux/JDK actualDirectorySyncs=" in evidence and "openDescriptors=0" in evidence
          assert "PASS AI round trip video gate:" in evidence
          assert "PASS offline share: real sealed static ZIP" in evidence
          for api in (26, 35):
              assert f"HOST_OFFLINE_SHARE api={api} " in evidence
              assert f"HOST_OFFLINE_SHARE_LIMIT api={api} " in evidence
          assert "HOST_OFFLINE_SHARE_UI one-shot/route/version/expiry/failure-return PASS" in evidence
          assert "HOST_TEMP_STORE api=26 repeated-success=closed exceptional-exit=closed primary-error=preserved other-owner=read/write/open" in evidence
          assert "PASS AI candidate lifecycle: three real candidate copies" in evidence
          for boundary in ("graph", "origins", "atomicity", "concurrency", "limits"):
              assert f"HOST_SAVED_STEP_COPY {boundary}:" in evidence, f"Missing saved-step-copy evidence: {boundary}"
          assert "HOST_STEP_COPY_WORKSPACE source-text/restored-panel=blocked" in evidence
          assert "HOST_STEP_COPY_WORKSPACE committed-refresh-failure=uncertain" in evidence
          for boundary in ("graph", "recovery", "migration"):
              assert f"HOST_SAVED_PROJECT_COPY {boundary}:" in evidence, f"Missing saved-project-copy evidence: {boundary}"
          assert "HOST_PROJECT_COPY_WORKSPACE all-source-input/home-restored-panel=blocked" in evidence
          assert "HOST_HOSTED_RELEASE native PNG/SQLite local-review-binding/canonical-whitelist/import-refusal/source-delete PASS" in evidence
          for boundary in ("single-confirm/busy-cancel", "confirmed-cancel/immediate-leave/reopen", "late-login/revoke/no-route-resurrection", "expired-session/can-relogin", "lost-session-response/one-day-warning", "installed-cancel/offline-retire/no-account-resurrection"):
              assert f"HOST_HOSTING_WORKSPACE {boundary} PASS" in evidence
          print("TAPSCENE_HOST_DATA_CHECKS_OK: original six checks plus temporary-store lifecycle, static native-PNG round trip, editor undo, offline sharing, saved-step and complete-project copying executed; device/video/power-loss checks remain separate")
          PY_HOST
      - name: Read the actual Android round-trip export with the independent TS reader
        if: steps.scope.outputs.android == 'true'
        run: |
          cd remotion-adapter
          npm exec --no -- tsc --noEmit
          node --import tsx test/roundtrip.verify.ts "$RUNNER_TEMP/ai-round-trip" \
            2>&1 | tee "$RUNNER_TEMP/ai-round-trip/ts-reader.txt"
          grep -q '^TAPSCENE_AI_ROUNDTRIP_TS_OK:' "$RUNNER_TEMP/ai-round-trip/ts-reader.txt"
      - name: Keep host Android data execution reports
        if: always() && steps.host_data.outcome != 'skipped' && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapscene-host-android-data-checks
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/host-data-checks.txt
            ${{ runner.temp }}/host-data-execution.txt
            ${{ runner.temp }}/ai-round-trip/
          retention-days: 7
          if-no-files-found: error
      - name: Inspect packaged OCR models, native dependencies, alignment and size
        if: steps.scope.outputs.android == 'true'
        run: |
          python3 tools/ocr-checks/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk --abis arm64-v8a \
            --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Check merged privacy settings
        if: steps.scope.outputs.android == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          candidates = list(Path("android/app/build/intermediates/merged_manifests").glob("debug/**/AndroidManifest.xml"))
          assert len(candidates) == 1, candidates
          root = ET.parse(candidates[0]).getroot()
          assert root.get("package") == "com.tapscene.preview.hevc"
          namespace = "{http://schemas.android.com/apk/res/android}"
          permissions = {item.get(namespace + "name") for item in root.findall("uses-permission")}
          forbidden = {
              "android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.READ_EXTERNAL_STORAGE", "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.MANAGE_EXTERNAL_STORAGE", "android.permission.READ_MEDIA_VIDEO",
              "android.permission.RECORD_AUDIO", "android.permission.CAPTURE_AUDIO_OUTPUT",
              "android.permission.BIND_ACCESSIBILITY_SERVICE",
          }
          assert not permissions & forbidden, permissions
          application = root.find("application")
          assert application.get(namespace + "allowBackup") == "false"
          # The official ORT AAR also contains a network telemetry Java wrapper;
          # only its pinned native runtime is imported by the C++ pipeline.
          assert all(not (item.get(namespace + "name") or "").startswith("ai.onnxruntime.")
                     for item in application.iter())
          services = application.findall("service")
          recording = [item for item in services if item.get(namespace + "name") == "com.tapscene.recording.RecordingService"]
          assert len(recording) == 1
          assert recording[0].get(namespace + "exported") == "false"
          assert recording[0].get(namespace + "foregroundServiceType") == "mediaProjection"
          assert all(item.get(namespace + "permission") != "android.permission.BIND_ACCESSIBILITY_SERVICE" for item in services)
          print("Merged manifest: no network/audio/broad storage/accessibility access; non-exported projection service; backup disabled.")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-signature.txt"
      - name: Keep the debug APK and lint result
        if: success() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapscene-phone-arm64-v8a
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: error
      - name: Render Compose shell previews on the host
        if: steps.scope.outputs.android == 'true'
        run: |
          # Layoutlib renders real Compose UI without an emulator or KVM. These are
          # review images, not device screenshots or a visual-regression pass.
          gradle -p android --no-daemon -PcompatibilityPreview=true :app:updateDebugScreenshotTest
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import struct

          root = Path("android/app/src/screenshotTestDebug/reference")
          images = sorted(root.rglob("*.png"))
          assert len(images) == 66, f"Expected sixty-six Compose review images, found {len(images)}"
          text_region_images = [image for image in images if "TextRegionScreenshotPreviewsKt" in str(image)]
          assert len(text_region_images) == 3, f"Expected three text-region review images, found {len(text_region_images)}"
          hosted_images = [image for image in images if "HostingScreenshotPreviewsKt" in str(image)]
          assert len(hosted_images) == 3, f"Expected three local-hosting review images, found {len(hosted_images)}"
          project_copy_images = [image for image in images if "SavedProjectCopyScreenshotPreviewsKt" in str(image)]
          assert len(project_copy_images) == 2, f"Expected two saved-project-copy review images, found {len(project_copy_images)}"
          copy_images = [image for image in images if "SavedStepCopyScreenshotPreviewsKt" in str(image)]
          assert len(copy_images) == 2, f"Expected two saved-step-copy review images, found {len(copy_images)}"
          share_images = [image for image in images if "OfflineShareScreenshotPreviewsKt" in str(image)]
          assert len(share_images) == 2, f"Expected two delivery share review images, found {len(share_images)}"
          ai_draft_images = [image for image in images if "AiDraftScreenshotPreviewsKt" in str(image)]
          assert len(ai_draft_images) == 8, f"Expected eight AI draft review images, found {len(ai_draft_images)}"
          lines = [
              "TapScene shell review: host-side Compose / Layoutlib renders.",
              "Not device screenshots; does not validate media decoding, touch, or system pickers.",
              "Sample data exists only in screenshotTest source files.",
              f"CI commit: {os.environ['GITHUB_SHA']}",
              "",
          ]
          for image in images:
              data = image.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", image
              width, height = struct.unpack(">II", data[16:24])
              assert width > 0 and height > 0, image
              if any(name in str(image) for name in ("EditorDraftRecovery", "SafeImage", "ScreenshotImport", "EditorNavigation", "ReviewAiNavigation", "AiDraftScreenshot", "OfflineShareScreenshot", "SavedStepCopyScreenshot", "SavedProjectCopyScreenshot", "HostingScreenshot")):
                  # A modal window can yield a valid but blank PNG in Layoutlib. Reject that
                  # before treating form and AI import images as usable review evidence.
                  import zlib
                  offset, compressed = 8, bytearray()
                  while offset < len(data):
                      size = struct.unpack(">I", data[offset:offset + 4])[0]
                      if data[offset + 4:offset + 8] == b"IDAT":
                          compressed.extend(data[offset + 8:offset + 8 + size])
                      offset += size + 12
                  assert len(set(zlib.decompress(compressed))) > 32, f"Blank recovery form render: {image}"
              lines.append(f"{image.relative_to(root)} | {width}x{height} | SHA256 {hashlib.sha256(data).hexdigest()}")
          report = Path(os.environ["RUNNER_TEMP"]) / "compose-review.txt"
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(report.read_text(encoding="utf-8"))
          PY
      - name: Keep native Compose review images
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tapscene-compose-review
          path: |
            android/app/src/screenshotTestDebug/reference/**/*.png
            android/app/build/reports/screenshotTest/
            android/app/build/test-results/screenshotTest/
            ${{ runner.temp }}/compose-review.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Check native media when an accelerated Android emulator is available
        if: steps.scope.outputs.android == 'true'
        timeout-minutes: 15
        run: |
          # Never change KVM/security permissions. Software boot was too slow/unreliable on
          # this runner; a missing runtime check must be visible, not reported as a test pass.
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            echo "NOT_RUN: Android media instrumentation; runner has no usable KVM acceleration." | tee "$RUNNER_TEMP/media-instrumentation.txt"
            echo "::warning::Android media runtime checks NOT RUN: no usable KVM. Build/lint are separate checks."
            exit 0
          fi
          # Build x86 only for a runner that can actually execute this emulator.
          # The arm64 phone artifact was already inspected and uploaded above.
          gradle -p android --no-daemon --max-workers=2 -PcompatibilityPreview=true \
            -PtapsceneAbi=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
          # adb and emulator must use the same standard key/preferences directory.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "system-images;android-35;default;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force \
            --name tapscene-media --path "$ANDROID_AVD_HOME/tapscene-media.avd" \
            --package "system-images;android-35;default;x86_64"
          test -f "$ANDROID_AVD_HOME/tapscene-media.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx tapscene-media
          "$ADB" start-server
          acceleration=off
          if test -r /dev/kvm && test -w /dev/kvm; then acceleration=on; fi
          "$ANDROID_HOME/emulator/emulator" -avd tapscene-media -port 5554 -no-window -noaudio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -accel "$acceleration" -cores 2 -memory 2048 \
            > "$RUNNER_TEMP/emulator.txt" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          export EMULATOR_PID="$emulator_pid"
          timeout 600 bash -c 'until "$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do kill -0 "$EMULATOR_PID" || exit 1; sleep 5; done'
          "$ADB" -s emulator-5554 install android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" -s emulator-5554 install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 300 "$ADB" -s emulator-5554 shell am instrument -w \
            com.tapscene.preview.hevc.test/com.tapscene.media.MediaCompatibilityInstrumentation \
            | tee "$RUNNER_TEMP/media-instrumentation.txt"
          grep -q TAPSCENE_MEDIA_CHECKS_OK "$RUNNER_TEMP/media-instrumentation.txt"
      - name: Keep diagnostic results
        if: always() && steps.scope.outputs.android == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-check-results
          path: |
            ${{ runner.temp }}/fixture-checks.txt
            ${{ runner.temp }}/media-instrumentation.txt
            ${{ runner.temp }}/emulator.txt
            ${{ runner.temp }}/apk-signature.txt
            ${{ runner.temp }}/package-checks.txt
          retention-days: 7
          if-no-files-found: ignore
