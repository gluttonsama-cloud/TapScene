name: Docs proposal checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-checks:
    name: docs-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test affected checkers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          git diff --quiet "$BASE_SHA" HEAD -- scripts/ tests/ .github/workflows/ docs/engineering/requirements.json
          changed=$?
          set -e
          case "$changed" in
            0) echo "No checker changes in this PR; checker regression not needed." ;;
            1) python3 tests/test_checks.py ;;
            *) echo "Cannot determine checker impact." >&2; exit "$changed" ;;
          esac
      - name: Check proposal documents
        run: python3 scripts/check_docs.py

  gate:
    name: ci/gate
    needs: [docs-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require actual content-check success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check_gate.py
